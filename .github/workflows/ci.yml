name: Mobile Multiplatform CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Static SSOT Architecture Validation (Fast Fail)
  architecture-lint:
    name: SSOT Architecture Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Architecture Linter
        run: python3 tools/verify_architecture.py

  # Job 2: Android & KMP JVM / Common Compilation & Unit Tests
  android-and-common:
    name: Android & KMP Common Build
    runs-on: ubuntu-latest
    needs: architecture-lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Compile KMP Common & Android Targets
        run: ./gradlew compileDebugKotlin compileKotlinMetadata --stacktrace

      - name: Run Unit Tests & Turbine Verification
        run: ./gradlew testDebugUnitTest --stacktrace

  # Job 3: Native iOS Compilation (KMP Native + SKIE)
  ios-native-build:
    name: iOS Target Compilation (macOS)
    runs-on: macos-14
    needs: architecture-lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Kotlin iOS Simulator Target
        run: ./gradlew compileKotlinIosSimulatorArm64 --stacktrace
